name: Doneko
options:
  bundleIdPrefix: com.nathanmarchant
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Doneko:
    type: application
    platform: macOS
    sources:
      - Doneko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanmarchant.doneko
        INFOPLIST_FILE: Doneko/Info.plist
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
