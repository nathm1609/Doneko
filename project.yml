name: Doneko
options:
  bundleIdPrefix: com.nathanmarchant
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # Version exacte : une nouvelle version n'entre pas dans l'app sans qu'on l'ait choisie.
    exactVersion: "2.4.0"
targets:
  Doneko:
    type: application
    platform: macOS
    sources:
      - Doneko
      - Shared
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanmarchant.doneko
        INFOPLIST_FILE: Doneko/Info.plist
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - DonekoTests
  DonekoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DonekoTests
    dependencies:
      - target: Doneko
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  DonekoiOS:
    type: application
    platform: iOS
    sources:
      - DonekoiOS
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanmarchant.doneko.ios
        INFOPLIST_FILE: DonekoiOS/Info.plist
        # iPhone seulement.
        TARGETED_DEVICE_FAMILY: "1"
        # Équipe personnelle gratuite : l'app installée sur un iPhone expire au bout de 7 jours.
        DEVELOPMENT_TEAM: DHX32546QF
        CODE_SIGN_STYLE: Automatic
    scheme: {}
