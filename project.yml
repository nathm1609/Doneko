name: Doneko
options:
  bundleIdPrefix: com.nathanmarchant
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  Doneko:
    type: application
    platform: macOS
    sources:
      - Doneko
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanmarchant.doneko
        INFOPLIST_FILE: Doneko/Info.plist
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - DonekoTests
  DonekoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DonekoTests
    dependencies:
      - target: Doneko
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
