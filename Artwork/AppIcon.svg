<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1F1B24" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Fond Crème, grille d'icône macOS (824 pt dans 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#FBF7F0" filter="url(#ombre)"/>
  <!-- Tête Mandarine : même tracé que l'icône de barre de menu (repère 18 × 18), agrandie -->
  <g transform="translate(188 195) scale(36)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M3.2 8.6 L3 2.4 L7 5.1 Q9 4.5 11 5.1 L15 2.4 L14.8 8.6 C15.6 13.6 12.5 16.2 9 16.2 C5.5 16.2 2.4 13.6 3.2 8.6 Z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="1.5"/>
    <!-- Rayures du roux tigré -->
    <path d="M7.9 5.9 V7.1 M9 5.6 V7.3 M10.1 5.9 V7.1" stroke="#1F1B24" stroke-opacity="0.16" stroke-width="0.6"/>
    <!-- Tache crème sur le museau, petit nez Sakura, pas de bouche -->
    <ellipse cx="9" cy="13.3" rx="2.7" ry="1.9" fill="#FBF7F0"/>
    <path d="M8.45 12.25 H9.55 L9 12.9 Z" fill="#F2668B" stroke="#F2668B" stroke-width="0.25"/>
    <!-- Yeux en amande -->
    <path d="M5.4 10.4 Q6.5 8.7 7.6 10.4 Q6.5 12.1 5.4 10.4 Z M10.4 10.4 Q11.5 8.7 12.6 10.4 Q11.5 12.1 10.4 10.4 Z" fill="#1F1B24"/>
  </g>
</svg>
