<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1F1B24" flood-opacity="0.22"/>
    </filter>
    <!-- Grille d'icône macOS : 824 pt dans 1024 -->
    <clipPath id="forme">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#FBF7F0" filter="url(#ombre)"/>
  <!-- Illustration AppIcon.png (générée avec Gemini) : agrandie pour que la tête remplisse environ 2/3 de la forme -->
  <image xlink:href="AppIcon.png" x="21.5" y="21.5" width="981" height="981" clip-path="url(#forme)"/>
</svg>
